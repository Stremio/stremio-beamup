    # The SSH tunnel to swarm-0:5000 is gone: the deployer is a swarm worker
    # now and runs the registry itself, so localhost:5000 is served by the
    # ingress mesh. The tunnel must not linger - its bind on port 5000 would
    # conflict with the mesh publishing the registry port on this host.
    - name: Stop and disable the legacy secure-tunnel service
      systemd:
        name: secure-tunnel.service
        enabled: no
        state: stopped
      failed_when: false

    - name: Remove the legacy secure-tunnel service file
      file:
        path: /etc/systemd/system/secure-tunnel.service
        state: absent
