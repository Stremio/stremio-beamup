- hosts: swarm_0
  tasks:
    - name: Merge node labels and new labels
      community.docker.docker_node:
        hostname: stremio-beamup-swarm-0
        labels:
          short_name: swarm-0

    # The deployer joins the swarm as a worker and hosts the registry
    # (beamup-sync-and-deploy pins it with node.labels.role == registry).
    # An explicit label keeps the placement stable if more workers are added.
    - name: Label the deployer node as the registry host
      community.docker.docker_node:
        hostname: stremio-addon-deployer
        labels:
          role: registry
